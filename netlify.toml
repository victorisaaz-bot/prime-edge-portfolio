[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/api/stream/:id"
  to = "https://drive.usercontent.google.com/download?id=:id&export=download"
  status = 200
  force = true

[[headers]]
  for = "/api/stream/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "video/mp4"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
