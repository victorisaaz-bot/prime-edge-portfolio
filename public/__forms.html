<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Edge Netlify Form Target</title>
</head>
<body>
  <!-- Hidden form for Netlify static crawler detection -->
  <form name="contact" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="company" />
    <input type="text" name="projectType" />
    <input type="text" name="budget" />
    <input type="text" name="deliveryDate" />
    <input type="text" name="projectGoal" />
    <textarea name="message"></textarea>
    <input type="checkbox" name="consent" />
  </form>
</body>
</html>
