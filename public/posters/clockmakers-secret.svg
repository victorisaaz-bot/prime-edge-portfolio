<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B06"/>
      <stop offset="100%" stop-color="#28170D"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#120B06" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#glowGrad)"/>

  <!-- Subtle Film Grain Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="0.5">
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
  </g>

  <!-- Geometric Abstract Artwork -->
  
      <circle cx="640" cy="350" r="180" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
      <circle cx="640" cy="350" r="130" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
      <line x1="640" y1="350" x2="640" y2="230" stroke="#F59E0B" stroke-width="3"/>
      <line x1="640" y1="350" x2="730" y2="350" stroke="#F59E0B" stroke-width="2"/>
    

  <!-- Letterbox bars hint -->
  <rect x="0" y="0" width="1280" height="40" fill="#000000" opacity="0.6"/>
  <rect x="0" y="680" width="1280" height="40" fill="#000000" opacity="0.6"/>

  <!-- Cinema Header Badges -->
  <text x="60" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2">PRIME EDGE AI // DIRECTORS CUT</text>
  <text x="1220" y="26" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="2">COOKE ANAMORPHIC EMULATION</text>

  <!-- Typography Content Block -->
  <g transform="translate(80, 560)">
    <rect x="-16" y="-30" width="220" height="24" rx="12" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="-14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#F59E0B" letter-spacing="2.5">CINEMATIC REALISM</text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">THE CLOCKMAKER'S SECRET</text>
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="1.5">PERIOD FANTASY & TIME MANIPULATION</text>
  </g>

  <!-- Play Trigger Aesthetic -->
  <g transform="translate(640, 340)">
    <circle cx="0" cy="0" r="44" fill="#0B1F33" fill-opacity="0.75" stroke="#F59E0B" stroke-width="2"/>
    <polygon points="-8,-14 16,0 -8,14" fill="#F59E0B"/>
  </g>
</svg>