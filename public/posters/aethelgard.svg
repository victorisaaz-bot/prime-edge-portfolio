<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060F1A"/>
      <stop offset="100%" stop-color="#0C2036"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060F1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#glowGrad)"/>

  <!-- Subtle Film Grain Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="0.5">
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
  </g>

  <!-- Geometric Abstract Artwork -->
  
      <polygon points="640,160 520,460 760,460" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.75"/>
      <polygon points="500,280 420,480 580,480" fill="none" stroke="#E2E8F0" stroke-width="1.5" opacity="0.4"/>
      <polygon points="780,280 700,480 860,480" fill="none" stroke="#E2E8F0" stroke-width="1.5" opacity="0.4"/>
    

  <!-- Letterbox bars hint -->
  <rect x="0" y="0" width="1280" height="40" fill="#000000" opacity="0.6"/>
  <rect x="0" y="680" width="1280" height="40" fill="#000000" opacity="0.6"/>

  <!-- Cinema Header Badges -->
  <text x="60" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2">PRIME EDGE AI // DIRECTORS CUT</text>
  <text x="1220" y="26" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="2">COLOSSAL SCALE CINEMATICS</text>

  <!-- Typography Content Block -->
  <g transform="translate(80, 560)">
    <rect x="-16" y="-30" width="220" height="24" rx="12" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="-14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="2.5">MUSIC VIDEO / TRAILER</text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">CHRONICLES OF AETHELGARD</text>
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="1.5">NORDIC DARK FANTASY GAME TEASER</text>
  </g>

  <!-- Play Trigger Aesthetic -->
  <g transform="translate(640, 340)">
    <circle cx="0" cy="0" r="44" fill="#0B1F33" fill-opacity="0.75" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="-8,-14 16,0 -8,14" fill="#38BDF8"/>
  </g>
</svg>